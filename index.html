<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Registration Form</title>
</head>
<body>
    <form action="#" class="form">
        <h1 class="text-center">Regestration Form</h1>

        <div class="progressbar">
            <div class="progress" id="progress"></div>
            <div class="progress-step progress-step-active" data-title="Intro"></div>
            <div class="progress-step" data-title="Contact"></div>
            <div class="progress-step" data-title="ID"></div>
            <div class="progress-step" data-title="password"></div>
        </div>
        <div class="form-step form-step-active">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username">
            </div>
            <div class="input-group">
                <lable for="position">Position</lable>
                <input type="text" name="position" id="position">

            </div>
            <div class="">
                <a href="#" class="btn btn-next" width-50 ml-auto>Next</a>
            </div>
        </div>

       <div class="form-step">
            <div class="input-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone">
            </div>
            <div class="input-group">
                <lable for="email">Email</lable>
                <input type="text" name="email" id="email">

            </div>
            <div class="btns-group">
                <a href="#" class="btn btn-prev">Privious</a> 
                <a href="#" class="btn btn-next" >Next</a>

            </div>
        </div> 
        


    <div class="form-step">
            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" name="dob" id="dob">
            </div>
            <div class="input-group">
                <lable for="ID">National ID</lable>
                <input type="number" name="ID" id="ID">

            </div>
            <div class="btns-group">
                <a href="#" class="btn btn-prev">Privious</a> 
                <a href="#" class="btn btn-next" >Next</a>

            </div>
        </div>
        
        <div class="form-step">
            <div class="input-group">
                <label for="password">password</label>
                <input type="password" name="pzssword" id="password">
            </div>
            <div class="input-group">
                <lable for="confirm password">Confirm Password</lable>
                <input type="password" name="confirm password" id="confirm password">

            </div>
            <div class="btns-group">
                <a href="#" class="btn btn-prev">Privious</a> 
                <input type="submit" value="Submit" class="btn">
 
            </div>
        </div>
        
        



    </form>
</body>
</html>
